{
  "name": "Review LLM user-path fixture isolation",
  "on": {
    "push": {
      "branches": [
        "probe/windows-user-path-isolation-2026-10-26"
      ],
      "paths": [
        "validation/llm1538/**",
        ".github/workflows/probe-llm1538-paths.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "PYTHONDONTWRITEBYTECODE": "1",
    "PIP_DISABLE_PIP_VERSION_CHECK": "1"
  },
  "jobs": {
    "path-control": {
      "name": "${{ matrix.os }} / Python 3.12",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 15,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-24.04",
            "windows-2025"
          ]
        }
      },
      "defaults": {
        "run": {
          "shell": "bash",
          "working-directory": "source"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "path": "probe",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@v6",
          "with": {
            "repository": "simonw/llm",
            "ref": "fdce6ab4b2a61af2e0df4f522e0ca9d0e8f3908b",
            "path": "source",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install exact-head development dependencies on ephemeral runner",
          "run": "python -m pip install --no-cache-dir . --group dev"
        },
        {
          "name": "Record full-file Ruff baseline without changing source",
          "run": "python ../probe/validation/llm1538/lint_control.py before --output \"${{ runner.temp }}/llm1538-lint-before.json\""
        },
        {
          "name": "Observe original four tests and root mkdir calls",
          "run": "python ../probe/validation/llm1538/audit_path_tests.py before --output \"${{ runner.temp }}/llm1538-before.json\" --basetemp \"${{ runner.temp }}/llm1538-before-tests\""
        },
        {
          "name": "Apply isolated-fixture suggestion only",
          "run": "python ../probe/validation/llm1538/apply_suggestion.py ../probe/validation/llm1538/replacements.json\ngit diff --stat\ngit diff --check"
        },
        {
          "name": "Verify same four cases without root mkdir calls",
          "run": "python ../probe/validation/llm1538/audit_path_tests.py after --output \"${{ runner.temp }}/llm1538-after.json\" --basetemp \"${{ runner.temp }}/llm1538-after-tests\""
        },
        {
          "name": "Check full-file Black and unchanged Ruff diagnostics",
          "run": "python -m black --check tests/test_keys.py tests/test_llm_logs.py\npython ../probe/validation/llm1538/lint_control.py after --baseline \"${{ runner.temp }}/llm1538-lint-before.json\" --output \"${{ runner.temp }}/llm1538-lint-after.json\""
        },
        {
          "name": "Upload bounded observations",
          "if": "always()",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "llm1538-${{ matrix.os }}",
            "path": "${{ runner.temp }}/llm1538-*.json",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
